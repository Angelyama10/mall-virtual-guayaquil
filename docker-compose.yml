services:

  web:
    build: ./apps/web

    container_name: mall_web

    ports:
      - "3000:3000"

    volumes:
      - ./apps/web:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    depends_on:
      - postgres
      - api



  api:
    build: ./apps/api

    container_name: mall_api

    ports:
      - "4000:3000"

    volumes:
      - ./apps/api:/app
      - /app/node_modules

    depends_on:
      - postgres



  postgres:
    image: postgres:17-alpine

    container_name: mall_postgres

    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: